<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Kegiatan - KampusEvent</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="navbar">
        <a href="index.html" class="logo">Kampus<span>Event</span></a>
        <nav>
            <a href="index.html">Beranda</a>
            <a href="kegiatan.html" class="active">Kegiatan</a>
            <a href="daftar.html">Pendaftaran</a>
        </nav>
    </header>

    <main class="page-container">
        <section class="page-heading">
            <p class="eyebrow">AGENDA KAMPUS</p>
            <h1>Jelajahi Kegiatan</h1>
            <p>Temukan kegiatan yang sesuai dengan minatmu.</p>
        </section>

        <section class="filter-panel">
            <input
                type="search"
                id="search-event"
                placeholder="Cari nama kegiatan..."
                aria-label="Cari nama kegiatan"
            >

            <select id="filter-category" aria-label="Filter kategori">
                <option value="Semua">Semua Kategori</option>
                <option value="Seminar">Seminar</option>
                <option value="Workshop">Workshop</option>
                <option value="Lomba">Lomba</option>
                <option value="Organisasi">Organisasi</option>
            </select>
        </section>

        <p id="event-count" class="result-count"></p>

        <section class="event-grid" id="all-events">
            <!-- Daftar kegiatan diisi oleh JavaScript -->
        </section>
    </main>

    <footer>
        <p>&copy; 2026 KampusEvent. Website Informasi Kegiatan Kampus.</p>
    </footer>
</body>
</html>
